name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      folia_ref:
        description: "Folia (chthollyphile/folia-major) commit, branch or tag to bundle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  # Pinned to the Folia version this app was written against. Run the workflow manually with
  # folia_ref = main to try the newest Folia.
  DEFAULT_FOLIA_REF: 43e7846d196f4c92a69f7806fe00be664ec84ef9

jobs:
  # Folia's web build, shared by the Android app and the Windows app.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch Folia source
        env:
          FOLIA_REF: ${{ github.event.inputs.folia_ref }}
        run: |
          REF="${FOLIA_REF:-$DEFAULT_FOLIA_REF}"
          echo "Bundling Folia at $REF"
          git init -q folia-src
          cd folia-src
          git remote add origin https://github.com/chthollyphile/folia-major.git
          git fetch -q --depth 1 origin "$REF"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %ci %s'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: folia-src/package-lock.json

      - name: Build Folia web bundle
        working-directory: folia-src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npx vite build
          test -f dist/index.html

      - name: Zip the bundle
        run: |
          cd folia-src/dist
          # Service workers are not used by either app.
          rm -f sw.js registerSW.js workbox-*.js folia-cover-sw.js
          zip -qr ../../folia.zip .
          cd ../..
          echo "folia.zip: $(du -h folia.zip | cut -f1), $(unzip -l folia.zip | tail -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: folia-web
          path: folia.zip
          retention-days: 3

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: folia-web

      - name: Put the bundle into the app's assets
        run: |
          ASSETS=app/src/main/assets/folia
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          unzip -q folia.zip -d "$ASSETS"
          echo "Bundle: $(du -sh "$ASSETS" | cut -f1), files: $(find "$ASSETS" -type f | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Lyric format fixtures (shared with the Windows build) must match; the live search over
      # NetEase / QQ / Kugou / LRCLIB / AMLL only writes a report.
      - name: Unit tests
        env:
          LIVE_LYRICS: "1"
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p android-reports
          cp app/build/reports/live-lyrics.txt android-reports/ 2>/dev/null || true
          cp -r app/build/test-results android-reports/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android-reports/
          retention-days: 7

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/FoliaController-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    needs: web
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: folia-web
          path: windows/FoliaController.Windows

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the exe
        run: |
          dotnet publish windows/FoliaController.Windows/FoliaController.Windows.csproj -c Release -o out/win `
            -p:Version=1.0.${{ github.run_number }} -nologo
          Get-ChildItem out/win | Format-Table Name, Length

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lyric format fixtures (must match the Android output)
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $p = Start-Process -FilePath out/win/FoliaController.exe -ArgumentList '--fixture-test', (Resolve-Path tests/lyrics).Path, (Join-Path $PWD 'reports/fixtures.txt') -Wait -PassThru
          Get-Content reports/fixtures.txt
          if ($p.ExitCode -ne 0) { throw "lyric fixtures differ from the Android output" }

      - name: Desktop lyrics sample picture
        run: |
          $out = Join-Path $PWD 'reports/desktop-lyrics.png'
          $p = Start-Process -FilePath out/win/FoliaController.exe -ArgumentList '--render-desktop-lyrics', $out -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "desktop lyrics drawing failed (code $($p.ExitCode))" }
          $errors = Join-Path $env:LOCALAPPDATA 'FoliaController\error.log'
          if (Test-Path $errors) { Get-Content $errors }

      - name: Desktop lyrics window on the real desktop
        run: |
          $png = Join-Path $PWD 'reports/desktop-lyrics-window.png'
          $log = Join-Path $PWD 'reports/desktop-lyrics-window.txt'
          $p = Start-Process -FilePath out/win/FoliaController.exe -ArgumentList '--desktop-lyrics-test', $png, $log -Wait -PassThru
          Get-Content $log
          $errors = Join-Path $env:LOCALAPPDATA 'FoliaController\error.log'
          if (Test-Path $errors) { Write-Host "---- error.log ----"; Get-Content $errors }
          if ($p.ExitCode -ne 0) { throw "the desktop lyrics window drew nothing (code $($p.ExitCode))" }

      - name: Smoke test (real server, fake player)
        run: |
          npm install --prefix windows/ci --no-audit --no-fund --silent playwright-core@1.48.2
          New-Item -ItemType Directory -Force reports | Out-Null
          $log = Join-Path $PWD 'reports/smoke.log'
          $server = Start-Process -FilePath out/win/FoliaController.exe -ArgumentList '--smoke-test', '39999', $log -PassThru
          # Screenshots first (state is untouched), then the protocol checks.
          node windows/ci/screenshots.mjs 39999 reports 2>&1 | Tee-Object -FilePath reports/screenshots.txt
          node windows/ci/smoke.mjs 39999 2>&1 | Tee-Object -FilePath reports/smoke-results.txt
          $code = $LASTEXITCODE
          New-Item "$log.stop" -ItemType File | Out-Null
          $server.WaitForExit(300000) | Out-Null
          Write-Host "---- smoke.log ----"
          Get-Content $log
          if ($code -ne 0) { exit $code }

      - name: Start the real app (tray, then a second launch opens the window)
        run: |
          Start-Transcript -Path reports/app-check.txt | Out-Null
          $exe = (Resolve-Path out/win/FoliaController.exe).Path
          $app = Start-Process -FilePath $exe -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "app exited right after start (code $($app.ExitCode))" }
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "app exited after opening its window (code $($app.ExitCode))" }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD "reports/window.png"))
          } catch { Write-Host "screen capture unavailable: $_" }
          Write-Host "state: $((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:39863/api/state).Content)"
          $errors = Join-Path $env:LOCALAPPDATA 'FoliaController\error.log'
          if (Test-Path $errors) { Write-Host "---- error.log ----"; Get-Content $errors }
          Stop-Process -Id $app.Id -Force
          Stop-Transcript | Out-Null
          if ((Test-Path $errors) -and (Select-String -Path $errors -Pattern 'FATAL' -Quiet)) { throw "fatal error logged" }

      # Test results and screenshots, also on a branch so they can be read without the
      # artifact storage (some networks can't reach it).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-reports
          path: reports/
          retention-days: 7

      - name: Name the exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/win/FoliaController.exe "dist/FoliaController-${{ github.run_number }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  # The APK on an emulator with a made-up song (`--ez demo true`): screenshots of the info card
  # (phone and tablet) and the gesture tutorial, to check the layout by eye.
  android-ui:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android-screenshots.sh apk android-ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui
          path: android-ui/
          retention-days: 7

  # Test results and screenshots from every build, on a branch so they can be read without the
  # artifact storage (some networks can't reach it).
  reports:
    needs: [android, windows, android-ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-reports
          path: reports/windows
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-reports
          path: reports/android
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-ui
          path: reports/android-ui
      - name: Publish to the ci-reports branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          cd reports
          echo "run ${{ github.run_number }} · ${{ github.sha }} · $(date -u +%FT%TZ) · android=${{ needs.android.result }} android-ui=${{ needs.android-ui.result }} windows=${{ needs.windows.result }}" > RUN.txt
          git init -q -b ci-reports
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI reports for build ${{ github.run_number }}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-reports

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - run: ls -la out

      # One release per build, so the files download straight from a phone or PC browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Folia 控制器 build ${{ github.run_number }}
          body: |
            自動建置。
            - **Android**：手機打開此頁，下載 `.apk` 安裝（會覆蓋舊版）。
            - **Windows**：下載 `.exe` 直接執行，不用安裝。第一次執行若出現 SmartScreen，按「其他資訊 → 仍要執行」。
          files: out/*
          make_latest: true
