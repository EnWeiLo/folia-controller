name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      folia_ref:
        description: "Folia (chthollyphile/folia-major) commit, branch or tag to bundle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  # Pinned to the Folia version this app was written against. Run the workflow manually with
  # folia_ref = main to try the newest Folia.
  DEFAULT_FOLIA_REF: 43e7846d196f4c92a69f7806fe00be664ec84ef9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Fetch Folia source
        env:
          FOLIA_REF: ${{ github.event.inputs.folia_ref }}
        run: |
          REF="${FOLIA_REF:-$DEFAULT_FOLIA_REF}"
          echo "Bundling Folia at $REF"
          git init -q folia-src
          cd folia-src
          git remote add origin https://github.com/chthollyphile/folia-major.git
          git fetch -q --depth 1 origin "$REF"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %ci %s'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: folia-src/package-lock.json

      - name: Build Folia web bundle
        working-directory: folia-src
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npx vite build
          test -f dist/index.html

      - name: Put the bundle into the app's assets
        run: |
          ASSETS=app/src/main/assets/folia
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -r folia-src/dist/. "$ASSETS/"
          # Service workers are not used inside the app (FoliaAssetServer also answers them with 404).
          rm -f "$ASSETS"/sw.js "$ASSETS"/registerSW.js "$ASSETS"/workbox-*.js "$ASSETS"/folia-cover-sw.js
          echo "Bundle size: $(du -sh "$ASSETS" | cut -f1), files: $(find "$ASSETS" -type f | wc -l)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/FoliaController-${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoliaController-${{ github.run_number }}
          path: out/*.apk

      # A release per build makes the APK downloadable straight from the phone's browser
      # (repo page → Releases), no zip to unpack.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Folia 控制器 build ${{ github.run_number }}
          body: "自動建置。手機打開此頁，下載 .apk 安裝即可（會覆蓋舊版）。"
          files: out/*.apk
          make_latest: true
