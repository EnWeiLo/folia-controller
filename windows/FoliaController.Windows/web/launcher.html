<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>流詞 Flowrics</title>
<style>
  html, body { margin: 0; height: 100%; background: #09090b; color: #a1a1aa;
    font: 15px/1.5 "Segoe UI", "Microsoft JhengHei UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="msg">正在開啟…</div>
<script>
// "/" picks this device's display settings (stored per device) and opens Folia's
// Now Playing page with them. Folia reads the events from this computer's
// /api/ws/lyric, so `host` is simply wherever this page was loaded from.
(function () {
  var MODES = ['classic', 'cadenza', 'partita', 'fume', 'monet', 'cappella', 'tilt', 'claddagh',
    'diorama', 'pendolo', 'sonnet', 'tempera', 'lumiere', 'still'];
  function get(key, fallback) {
    try {
      var raw = localStorage.getItem('fc.' + key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  // Flowrics' own effects live on /fx.html (shared/web).
  var FX = ['clock', 'dive', 'minimal', 'karaoke', 'cinema', 'ink', 'ripple', 'stardust', 'neon', 'vinyl', 'comic', 'terminal',
    'danmaku', 'led', 'boom', 'meteor', 'glitch', 'vortex', 'fireworks', 'jelly', 'warp', 'shatter'];
  var SUBTITLES = ['translation', 'romanization', 'both', 'none'];
  var subtitle = get('subtitle', 'translation');
  var mode = get('mode', 'fx:ink');
  if (typeof mode === 'string' && mode.indexOf('fx:') === 0) {
    var fx = mode.slice(3);
    if (FX.indexOf(fx) < 0) fx = 'dive';
    location.replace('/fx.html?fx=' + fx + '&host=' + encodeURIComponent(location.host) + '&cfg=' +
      encodeURIComponent(JSON.stringify({ subtitleContentMode: SUBTITLES.indexOf(subtitle) >= 0 ? subtitle : 'translation', standby: get('standby', true) !== false })));
    return;
  }
  if (MODES.indexOf(mode) < 0) mode = 'classic';
  var query = 'obs=1&obsSource=now-playing&host=' + encodeURIComponent(location.host) +
    '&visualizer=' + encodeURIComponent(mode);
  if (get('daylight', false)) query += '&daylight=1';
  // Folia appearance overrides: the subtitle line under the lyrics, and 流暢 quality's static
  // mode (no geometric background).
  var cfg = { subtitleContentMode: SUBTITLES.indexOf(subtitle) >= 0 ? subtitle : 'translation' };
  if (get('quality', '') === 'smooth') cfg.staticMode = true;
  query += '&cfg=' + encodeURIComponent(JSON.stringify(cfg));
  location.replace('/?' + query);
})();
</script>
</body>
</html>
